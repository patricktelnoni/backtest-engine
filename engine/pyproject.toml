[project]
name = "btengine"
version = "0.1.0"
description = "Backtest engine (pure Python, no web dependencies)"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2", "numpy>=1.26", "pydantic>=2.6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
btengine = "btengine.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
