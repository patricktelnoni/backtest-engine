# /etc/nginx/conf.d/backtest-engine.cloud.conf  (or sites-available/ + symlink on Debian/Ubuntu)
#
# Layout assumed on the server:
#   /opt/backtest-platform/web/dist   <- output of `npm run build` (static files)
#   uvicorn on 127.0.0.1:8001         <- FastAPI (see deploy/systemd/backtest-api.service)
#
# Domain: backtest-engine.cloud (www. redirects to the bare domain). It shares the VPS with other
# sites (e.g. batasku-admin.id): nginx picks the server{} block by server_name, so they don't clash.
# Obtain the certificate BEFORE installing this file (nginx -t fails if the cert files don't exist):
#   sudo certbot certonly --nginx -d backtest-engine.cloud -d www.backtest-engine.cloud

# Both directives must live at http{} level; files in conf.d/ / sites-enabled/ are included there.
# Backtests are CPU-heavy: 30 API requests/minute per client IP (bursts of 10).
limit_req_zone $binary_remote_addr zone=bt_api:10m rate=30r/m;
# Login: 10 attempts/minute per IP at the edge. The API adds its own lockout (5 failures per username
# or 20 per IP within 15 minutes), so this only sheds load from scripted attacks early.
limit_req_zone $binary_remote_addr zone=bt_login:10m rate=10r/m;

upstream backtest_api {
    server 127.0.0.1:8001;
    keepalive 16;
}

# HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name backtest-engine.cloud www.backtest-engine.cloud;
    server_tokens off;
    return 301 https://backtest-engine.cloud$request_uri;
}

# https://www. -> https://bare domain
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.backtest-engine.cloud;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/backtest-engine.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/backtest-engine.cloud/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    return 301 https://backtest-engine.cloud$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;                      # nginx >= 1.25.1; on older versions use `listen 443 ssl http2;`
    server_name backtest-engine.cloud;
    server_tokens off;             # no nginx version in headers/error pages

    ssl_certificate     /etc/letsencrypt/live/backtest-engine.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/backtest-engine.cloud/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;

    # Security headers. IMPORTANT: nginx drops ALL server-level add_header lines inside any location that has
    # its own add_header, so the locations below set caching with `expires` instead of add_header.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    # No inline scripts are allowed (the theme bootstrap is /theme-init.js). Inline *styles* are needed for
    # React/Recharts style attributes. connect-src 'self' keeps the API same-origin.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ---------- Frontend (static build) ----------
    root /opt/backtest-platform/web/dist;
    index index.html;

    # Never serve dotfiles (.git, .env, ...) should any end up under root.
    location ~ /\. {
        deny all;
    }

    # Vite fingerprints files in /assets (index-<hash>.js), so they can be cached for a year.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # index.html (and theme-init.js) must be revalidated so users pick up new builds. `expires -1` sends
    # Cache-Control: no-cache without an add_header (which would drop the security headers above).
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }

    # ---------- API ----------
    location = /api/auth/login {
        limit_req zone=bt_login burst=5 nodelay;
        limit_req_status 429;
        client_max_body_size 4k;             # a username + password, nothing more

        proxy_pass http://backtest_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;   # overwrite, never trust a client-sent value
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        limit_req zone=bt_api burst=10 nodelay;
        limit_req_status 429;

        # The API accepts CSV uploads up to 20 MB; allow a little extra for multipart overhead.
        client_max_body_size 21m;

        proxy_pass http://backtest_api;      # no trailing slash: /api/... is passed through unchanged
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # $remote_addr, not $proxy_add_x_forwarded_for: a client could otherwise prepend a fake IP and
        # dodge the API's per-IP login throttling.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # /api/compare with 6 strategies on a large file can take a while.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # FastAPI's /docs and /openapi.json are disabled in the app and not proxied here either.
}
